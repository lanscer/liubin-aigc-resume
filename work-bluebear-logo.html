  .workimg { margin: 0; }

  .zoom {

    inset: 0;
    z-index: var(--z-overlay);

    padding: clamp(16px, 4vw, 56px);
    background: rgba(8, 8, 8, 0.95);
  }

  .zoom img {
    max-width: 100%;

    object-fit: contain;
    border-radius: 6px;
    position: relative;
    z-index: 1;
  }

  .zoom__close {

    right: 24px;

    color: var(--panel-ink);

  }

<script>
  // Esc 关闭放大层（遮罩与「关闭」本身是普通锚点，无跳转文件）
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var h = location.hash;
    if (h.indexOf('#zoom-') !== 0) return;
    location.hash = '#' + h.slice(6).replace('zoom-', 'img-');
  });
</script>
<script src="assets/js/motion.js" defer></script>

<script>
/* 长条图（高/宽 > 3）一律铺满 950；其余图片不超过自身原始宽度，避免小图被放大发虚 */
(function () {
  function tune(img) {
    var nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh) return;
    var isStrip = (nh / nw) > 3;
    if (isStrip) {
      img.style.width = '';
      img.style.maxWidth = '';
      img.style.marginInline = '';
    } else if (nw < 950) {
      img.style.width = nw + 'px';
      img.style.maxWidth = '100%';
      img.style.marginInline = 'auto';
    } else {
      img.style.width = '';
      img.style.maxWidth = '';
      img.style.marginInline = '';
    }
  }
  function tuneAll() { document.querySelectorAll('.workimg img').forEach(tune); }
  document.querySelectorAll('.workimg img').forEach(function (img) { img.addEventListener('load', function () { tune(img); }); });
  document.addEventListener('DOMContentLoaded', function () { tuneAll(); setTimeout(tuneAll, 300); });
  window.addEventListener('load', function () { tuneAll(); setTimeout(tuneAll, 500); });
  if (document.readyState === 'complete') tuneAll();
})();
</script>
